apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-worker
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: crash-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-worker
      kubecone.dev/scenario: crash-loop
  template:
    metadata:
      labels:
        app: checkout-worker
        kubecone.dev/scenario: crash-loop
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - echo "FATAL: DATABASE_URL is not set"; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
