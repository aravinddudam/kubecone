apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-importer
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: pending-pod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-importer
      kubecone.dev/scenario: pending-pod
  template:
    metadata:
      labels:
        app: batch-importer
        kubecone.dev/scenario: pending-pod
    spec:
      nodeSelector:
        kubecone.dev/no-such-pool: "true"
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
