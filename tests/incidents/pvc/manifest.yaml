apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: kubecone-missing-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-writer
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-writer
  template:
    metadata:
      labels:
        app: ledger-writer
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger
