apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: oom-killed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
      kubecone.dev/scenario: oom-killed
  template:
    metadata:
      labels:
        app: payment-api
        kubecone.dev/scenario: oom-killed
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                dd if=/dev/zero of=/tmp/blob bs=1M count=128 || true
              done
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 24Mi
              cpu: 100m
