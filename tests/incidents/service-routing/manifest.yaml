apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: service-routing
spec:
  selector:
    app: payments-missing
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: kubecone-lab
  labels:
    kubecone.dev/scenario: service-routing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
